{{ define "main" }}
<article class="section-index">

  <h1>{{ .Title }}</h1>

  <section class="content">
    {{ .Content }}
  </section>

  <h2>Notes</h2>
  <ul>
    {{ range sort .Pages "Weight" }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
    {{ end }}
  </ul>

</article>
{{ end }}
