{{ define "main" }}
<link rel="stylesheet" href="/css/quiz.css">
<article class="project">

  <!-- Title -->
  <h1>{{ .Title }}</h1>
  Contents
  {{ .Page.TableOfContents }}



  <!-- Summary -->
  <p class="summary">{{ .Summary | safeHTML }}</p>

  <!-- Main Content -->
  <section class="content">
    {{ .Content | safeHTML }}
  </section>

  <!-- GitHub Link Partial -->
{{ if templates.Exists "partials/github.html" }}
  {{ partial "github.html" . }}
{{ end }}

</article>
{{ end }}
