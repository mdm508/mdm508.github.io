<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" role="img" aria-labelledby="title desc"><title id="title">Pico WH and OLED connected through a breadboard</title><desc id="desc">The Pico straddles the center gap with headers in B and I, starting at row 1. A1 shares the GP0 row and connects to OLED SDA. A2 shares GP1 and connects to SCL. A3 shares GND and connects to GND. J5 shares physical pin 36, the 3.3 V output, and connects to VCC. Row numbers are examples; each five-hole group is separate from the group across the center gap.</desc><g font-family="system-ui,sans-serif"><rect x="0" y="0" width="900" height="670" rx="10" fill="#fcf8ed" stroke="#8c745f"/><text x="28" y="34" font-size="22" fill="#382b21" text-anchor="start" >Breadboard connection: same signals, shared rows</text><rect x="85" y="65" width="290" height="490" rx="10" fill="#ede9df" stroke="#8c745f"/><rect x="210" y="95" width="20" height="440" rx="0" fill="#dbd4c7" stroke="#8c745f"/><text x="110" y="90" font-size="12" fill="#382b21" text-anchor="middle" >A</text><text x="130" y="90" font-size="12" fill="#382b21" text-anchor="middle" >B</text><text x="150" y="90" font-size="12" fill="#382b21" text-anchor="middle" >C</text><text x="170" y="90" font-size="12" fill="#382b21" text-anchor="middle" >D</text><text x="190" y="90" font-size="12" fill="#382b21" text-anchor="middle" >E</text><text x="250" y="90" font-size="12" fill="#382b21" text-anchor="middle" >F</text><text x="270" y="90" font-size="12" fill="#382b21" text-anchor="middle" >G</text><text x="290" y="90" font-size="12" fill="#382b21" text-anchor="middle" >H</text><text x="310" y="90" font-size="12" fill="#382b21" text-anchor="middle" >I</text><text x="330" y="90" font-size="12" fill="#382b21" text-anchor="middle" >J</text><text x="93" y="129" font-size="10" fill="#382b21" text-anchor="end" >1</text><circle cx="110" cy="125" r="3" fill="#9c978c"/><circle cx="130" cy="125" r="3" fill="#9c978c"/><circle cx="150" cy="125" r="3" fill="#9c