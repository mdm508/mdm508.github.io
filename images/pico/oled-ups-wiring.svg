<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="title desc"><title id="title">OLED wired directly to the labelled Pico UPS breakout pins</title><desc id="desc">Four female-to-female leads connect GND to GND, 3V3 to VCC, GP1 to SCL, and GP0 to SDA. Pin locations in this signal diagram are grouped for clarity. Use the printed labels on your board.</desc><g font-family="system-ui,sans-serif"><rect x="0" y="0" width="900" height="490" rx="10" fill="#fcf8ed" stroke="#8c745f"/><text x="28" y="34" font-size="22" fill="#382b21" text-anchor="start" >Direct connection: four female-to-female leads</text><rect x="35" y="70" width="290" height="325" rx="10" fill="#e3dccb" stroke="#8c745f"/><text x="55" y="100" font-size="20" fill="#382b21" text-anchor="start" >Pico WH on the UPS</text><rect x="60" y="120" width="100" height="240" rx="6" fill="#436c4e" stroke="#8c745f"/><rect x="85" y="108" width="50" height="28" rx="3" fill="#c6c9c4" stroke="#8c745f"/><text x="110" y="171" font-size="18" fill="#fffaf0" text-anchor="middle" >Pico</text><rect x="80" y="192" width="60" height="55" rx="0" fill="#292e2a" stroke="#8c745f"/><text x="110" y="223" font-size="11" fill="#fffaf0" text-anchor="middle" >RP2040</text><rect x="80" y="265" width="60" height="55" rx="0" fill="#c6c9c4" stroke="#8c745f"/><text x="55" y="383" font-size="14" fill="#382b21" text-anchor="start" >Use the exposed, labelled pins</text><rect x="600" y="90" width="265" height="305" rx="10" fill="#e3dccb" stroke="#8c745f"/><text x="620" y="120" font-size="20" fill="#382b21" text-anchor="start" >SSD1306 OLED</text><rect x="640" y="137" width="185" height="43" rx="3" fill="#252b28" stroke="#8c745f"/><text x="732" y="165" font-size="21" fill="#f3d18a" text-anchor="middle" >Hello!</text><text x="182" y="216" font-size="18" fill="#382b21" text-anchor="start" >GND</text><text x="182" y="234" font-size="11" fill="#382b21" text-anchor="start" >pin 3 shown</text><path d="M325 211 H600" fill="none" stroke="#505452" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="309" y="203" width="23" height="16" rx="0" fill="#33352f" stroke="#8c745f"/><rect x="590" y="203" width="23" height="16" rx="0" fill="#33352f" stroke="#8c745f"/><text x="630" y="217" font-size="18" fill="#382b21" text-anchor="start" >GND</text><text x="182" y="260" font-size="18" fill="#382b21" text-anchor="start" >3V3</text><text x="182" y="278" font-size="11" fill="#382b21" text-anchor="start" >pin 36</text><path d="M325 255 H600" fill="none" stroke="#b14e36" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="309" y="247" width="23" height="16" rx="0" fill="#33352f" stroke="#8c745f"/><rect x="590" y="247" width="23" height="16" rx="0" fill="#33352f" stroke="#8c745f"/><text x="630" y="261" font-size="18" fill="#382b21" text-anchor="start" >VCC</text><text x="182" y="304" font-size="18" fill="#382b21" text-anchor="start" >GP1</text><text x="182" y="322" font-size="11" fill="#382b21" text-anchor="start" >pin 2</text><path d="M325 299 H600" fill="none" stroke="#3b7389" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="309" y="291" width="23" height="16" rx="0" fill="#33352f" stroke="#8c745f"/><rect x="590" y="291" width="23" height="16" rx="0" fill="#33352f" stroke="#8c745f"/><text x="630" y="305" font-size="18" fill="#382b21" text-anchor="start" >SCL</text><text x="182" y="348" font-size="18" fill="#382b21" text-anchor="start" >GP0</text><text x="182" y="366" font-size="11" fill="#382b21" text-anchor="start" >pin 1</text><path d="M325 343 H600" fill="none" stroke="#6e8146" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="309" y="335" width="23" height="16" rx="0" fill="#33352f" stroke="#8c745f"/><rect x="590" y="335" width="23" height="16" rx="0" fill="#33352f" stroke="#8c745f"/><text x="630" y="349" font-size="18" fill="#382b21" text-anchor="start" >SDA</text><text x="450" y="431" font-size="17" fill="#382b21" text-anchor="middle" >Sockets fit over the metal pins at both ends.</text><text x="450" y="461" font-size="14" fill="#382b21" text-anchor="middle" >Signal diagram: terminals are grouped for clarity, not placed to scale.</text></g></svg>
