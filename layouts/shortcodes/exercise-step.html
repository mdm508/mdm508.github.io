{{ $kind := .Get 0 }}
{{ $labels := dict "predict" "Predict" "try" "Try" "explain" "Explain" "plan" "Plan" }}
{{ $label := index $labels $kind }}
{{ if not $label }}{{ errorf "Unknown exercise step %q at %s" $kind .Position }}{{ end }}
<div class="exercise-step exercise-step--{{ $kind }}">
<div class="exercise-step__label">
<svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
{{ if eq $kind "predict" }}<path d="M8 16c0-2-3-3-3-7a7 7 0 0 1 14 0c0 4-3 5-3 7M8 17h8M9 20h6M10 23h4M9 8l3 3 3-3M12 11v6"/>
{{ else if eq $kind "try" }}<path d="M8 4l12 8-12 8z"/>
{{ else if eq $kind "explain" }}<path d="M20 15a3 3 0 0 1-3 3H9l-5 4v-4a3 3 0 0 1-2-3V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3zM6 8h10M6 12h7"/>
{{ else }}<path d="M4 16L16 4l4 4L8 20l-5 1zM13 7l4 4M4 16l4 4"/>
{{ end }}
</svg>
<strong>{{ $label }}</strong>
</div>
<div class="exercise-step__content">
{{ .Inner | markdownify }}
</div>
</div>
