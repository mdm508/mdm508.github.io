<figure class="oled-players" aria-label="How our Python objects and the physical OLED cooperate">
<div class="oled-players__layout">
<div class="oled-players__pico">
<p class="oled-players__heading">On the Pico: our program and objects</p>
<p class="oled-players__driver">We import display code from <code>ssd1306.py</code>, the borrowed driver.</p>
<div class="oled-players__software">
<div class="oled-players__card"><strong><code>main.py</code></strong>Our instructions: choose what to draw, where, and when.<p>Calls methods on <code>oled</code>.</p></div>
<span class="oled-players__arrow" aria-hidden="true">→</span>
<div class="oled-players__card"><strong><code>oled</code> object</strong>Holds the prepared picture in RAM.<p><code>fill()</code>, <code>text()</code>, and <code>pixel()</code> draw into it.</p><p><code>show()</code> uses the connection to send it.</p></div>
<span class="oled-players__arrow" aria-hidden="true">→</span>
<div class="oled-players__card"><strong><code>i2c</code> object</strong>Controls the communication link.<p>I2C0<br>GP0 → SDA<br>GP1 → SCL</p></div>
</div>
</div>
<div class="oled-players__wire"><span>SDA: data</span> <span>SCL: clock</span><span class="oled-players__arrow" aria-hidden="true">→</span></div>
<div class="oled-players__card"><strong>Physical OLED</strong>The SSD1306 controller receives commands and picture data.<div class="oled-players__screen">HELLO</div>It drives the pixels.</div>
</div>
<figcaption>The drawing calls prepare a picture; <code>show()</code> sends it. Power and ground are also required. <a href="/images/pico/phase-1-players.svg">Open the wide diagram</a>.</figcaption>
</figure>
