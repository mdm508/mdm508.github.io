<style>
  .python-session-note {
    margin: 1.5rem 0;
    padding: 1rem 1.2rem;
    color: #30302e;
    background: #eeedea;
    border: 1px solid #c8c7c2;
    border-left: 4px solid #85847f;
    border-radius: 6px;
  }
  .python-session-note h3 { margin-top: 0; }
  .python-session-note > :last-child { margin-bottom: 0; }
  .python-session-note code { overflow-wrap: anywhere; }
</style>
<aside class="python-session-note" aria-label="VS Code and MicroPico: keep your Python session">
{{ .Inner | markdownify }}
</aside>
