<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">The objects and hardware behind our first OLED picture</title><desc id="desc">On the Pico, main.py calls the oled object, which holds the prepared picture in memory. Imported ssd1306.py supplies the display driver code. Calling show uses the i2c object to send commands and image data over SDA and SCL. The physical OLED controller receives this and drives its pixels. Power and ground are also needed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#684421"/></marker></defs><g font-family="system-ui,sans-serif"><rect x="10" y="10" width="810" height="370" rx="8" fill="#ece4d3" stroke="#8c745f"/><text x="30" y="40" font-size="21" fill="#382b21" text-anchor="start">On the Pico: our Python program and objects</text><rect x="35" y="75" width="200" height="115" rx="8" fill="#f6ecd3" stroke="#8c745f"/><text x="53" y="105" font-size="21" fill="#382b21" text-anchor="start">main.py</text><text x="53" y="135" font-size="17" fill="#382b21" text-anchor="start">Our instructions</text><text x="53" y="162" font-size="17" fill="#382b21" text-anchor="start">What, where, when?</text><rect x="300" y="75" width="245" height="180" rx="8" fill="#f6ecd3" stroke="#8c745f"/><text x="320" y="105" font-size="21" fill="#382b21" text-anchor="start">oled object</text><text x="320" y="137" font-size="17" fill="#382b21" text-anchor="start">fill() · text() · pixel()</text><text x="320" y="172" font-size="17" fill="#382b21" text-anchor="start">Prepared picture in RAM</text><text x="320" y="204" font-size="17" fill="#382b21" text-anchor="start">show(): send the picture</text><text x="320" y="235" font-size="15" fill="#382b21" text-anchor="start">to the OLED controller</text><path d="M235 126 H293" fill="none" stroke="#684421" stroke-width="3" marker-end="url(#arrow)"/><text x="268" y="112" font-size="14" fill="#382b21" text-anchor="middle">calls</text><rect x="610" y="75" width="185" height="180" rx="8" fill="#f6ecd3" stroke="#8c745f"/><text x="629" y="105" font-size="21" fill="#382b21" text-anchor="start">i2c object</text><text x="629" y="137" font-size="17" fill="#382b21" text-anchor="start">Controls the link</text><text x="629" y="170" font-size="17" fill="#382b21" text-anchor="start">I2C0</text><text x="629" y="201" font-size="17" fill="#382b21" text-anchor="start">GP0: SDA</text><text x="629" y="231" font-size="17" fill="#382b21" text-anchor="start">GP1: SCL</text><path d="M545 126 H603" fill="none" stroke="#684421" stroke-width="3" marker-end="url(#arrow)"/><text x="576" y="112" font-size="14" fill="#382b21" text-anchor="middle">uses</text><rect x="35" y="275" width="510" height="76" rx="8" fill="#f6ecd3" stroke="#8c745f"/><text x="53" y="303" font-size="20" fill="#382b21" text-anchor="start">ssd1306.py — borrowed driver code</text><text x="53" y="330" font-size="16" fill="#382b21" text-anchor="start">Imported to create and operate the display object.</text><path d="M423 275 V263" fill="none" stroke="#684421" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="900" y="40" font-size="21" fill="#382b21" text-anchor="start">Physical OLED</text><rect x="920" y="75" width="265" height="245" rx="8" fill="#e2d7c3" stroke="#8c745f"/><text x="940" y="105" font-size="21" fill="#382b21" text-anchor="start">SSD1306 controller</text><text x="940" y="134" font-size="16" fill="#382b21" text-anchor="start">Receives commands + data</text><rect x="956" y="173" width="193" height="85" rx="8" fill="#292b25" stroke="#8c745f"/><text x="1052" y="224" font-size="25" fill="#f3d18a" text-anchor="middle">HELLO</text><text x="1052" y="291" font-size="17" fill="#382b21" text-anchor="middle">Drives the pixels</text><path d="M795 166 H912" fill="none" stroke="#6e8146" stroke-width="3" marker-end="url(#arrow)"/><text x="855" y="153" font-size="15" fill="#382b21" text-anchor="middle">SDA</text><path d="M795 224 H912" fill="none" stroke="#3b7389" stroke-width="3" marker-end="url(#arrow)"/><text x="855" y="211" font-size="15" fill="#382b21" text-anchor="middle">SCL</text><text x="1005" y="357" font-size="15" fill="#382b21" text-anchor="middle">Power + ground also required.</text></g></svg>
