baseURL = 'https://mdm508.github.io'
locale = 'en-US'
title = 'Coding With Matt'
theme = 'hugo-xmin'
enableRobotsTXT = true

[params]
  # Basic favicon (placed in /static/favicon.ico)
  favicon = "favicon.ico"
  asset_version = "20260906-video-table-v1"
  description = "Patient, project-based online coding and math tutoring for kids and teens, including AP Computer Science A and AP Computer Science Principles."
  email = "matthedm@uci.edu"
  images = ["/photo/matthew-mclaughlin-tutor.webp"]

[markup]
  [markup.tableOfContents]
    endLevel = 2
    startLevel = 2
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

custom_css = ["custom.css"]

[[menu.main]]
name = "Home"
url = "/"
weight = 1

